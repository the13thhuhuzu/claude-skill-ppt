<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1120 700">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b8c4cf" stroke-width="1" opacity=".42"/>
    </pattern>
    <filter id="grain"><feTurbulence baseFrequency=".8" numOctaves="2" stitchTiles="stitch" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
  </defs>
  <rect width="1120" height="700" fill="#f1f3f5"/>
  <rect width="1120" height="700" fill="url(#grid)" opacity=".6"/>
  <rect width="1120" height="700" filter="url(#grain)" opacity=".35"/>
  <g opacity=".18" transform="translate(55 36) scale(.9)">
    <rect x="150" y="170" width="360" height="470" rx="26" fill="#d9e1e8" stroke="#0a1f3d" stroke-width="3"/><rect x="610" y="170" width="360" height="470" rx="26" fill="#f8fafc" stroke="#0a1f3d" stroke-width="3"/><circle cx="330" cy="310" r="64" fill="#b9795d" stroke="#0a1f3d" stroke-width="3"/><path d="M270 455 H410 M270 510 H390" stroke="#6f8fae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M720 295 H860 M720 350 H830 M720 405 H880 M720 460 H800" stroke="#6f8fae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M520 405 H595 M570 375 L600 405 L570 435" stroke="#0a1f3d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <g class="argument-layer"><rect x="190" y="590" width="240" height="76" rx="16" fill="#b9795d" stroke="#0a1f3d" stroke-width="2.5"/>
      <text x="212" y="626" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#0a1f3d">人类</text>
      <text x="212" y="658" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#415a72">方向 / 判断 / 责任</text>
      <rect x="690" y="590" width="240" height="76" rx="16" fill="#d9e1e8" stroke="#0a1f3d" stroke-width="2.5"/>
      <text x="712" y="626" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#0a1f3d">Agent</text>
      <text x="712" y="658" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#415a72">检索 / 整理 / 执行</text>
      <text x="470" y="616" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#6f8fae">协作边界</text></g>
  <text x="70" y="92" font-family="Noto Serif SC, Songti SC, serif" font-size="48" font-weight="700" fill="#0a1f3d">人机分工</text>
  <text x="72" y="142" font-family="Noto Sans SC, sans-serif" font-size="24" fill="#415a72">人定方向，Agent 跑流程</text>
  <path d="M70 168H405" stroke="#0a1f3d" stroke-width="2" opacity=".45"/>
</svg>