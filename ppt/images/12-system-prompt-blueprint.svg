      <text x="127" y="648" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#415a72">我是谁</text>
      <rect x="315" y="580" width="185" height="70" rx="16" fill="#d9e1e8" stroke="#0a1f3d" stroke-width="2.5"/>
      <text x="337" y="616" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#0a1f3d">边界</text>
      <text x="337" y="648" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#415a72">不做什么</text>
      <rect x="525" y="580" width="185" height="70" rx="16" fill="#f8fafc" stroke="#0a1f3d" stroke-width="2.5"/>
