      <text x="807" y="628" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#415a72">两者配合才可交付</text>
      <path d="M350 598 H406" stroke="#0a1f3d" stroke-width="3" stroke-linecap="round"/><path d="M406 584 L430 598 L406 612" fill="none" stroke="#0a1f3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M695 598 H751" stroke="#0a1f3d" stroke-width="3" stroke-linecap="round"/><path d="M751 584 L775 598 L751 612" fill="none" stroke="#0a1f3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
